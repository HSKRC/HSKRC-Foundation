<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Reset Admin Password | HSKRC Humanitarian Foundation</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="foundation-supabase.js"></script><link rel="stylesheet" href="foundation-ops.css"><style>.wrap{min-height:100vh;display:grid;place-items:center;padding:30px}.box{width:min(520px,100%);border:1px solid #ddd;padding:28px}.field{display:grid;gap:6px;margin:14px 0}.field input{padding:12px;border:1px solid #bbb;font:inherit}.msg{min-height:24px;color:#8f1d2c}</style></head><body><main class="wrap"><div class="box"><div class="eyebrow">Admin security</div><h1 style="font-size:2.4rem">Set a new password</h1><p>Enter a new password for your Foundation administrator account.</p><form id="resetForm"><div class="field"><label>New password</label><input id="p1" type="password" minlength="10" required></div><div class="field"><label>Confirm new password</label><input id="p2" type="password" minlength="10" required></div><button class="btn primary" type="submit">Update password</button><div id="msg" class="msg"></div></form></div></main><script>
window.addEventListener("DOMContentLoaded",()=>{
 const form=document.querySelector("#resetForm"), msg=document.querySelector("#msg");
 form.addEventListener("submit",async e=>{
  e.preventDefault();
  const p1=document.querySelector("#p1").value,p2=document.querySelector("#p2").value;
  if(p1!==p2){msg.textContent="Passwords do not match.";return}
  if(p1.length<10){msg.textContent="Use at least 10 characters.";return}
  msg.textContent="Updating password…";
  const {error}=await foundationSupabase.auth.updateUser({password:p1});
  if(error){msg.textContent=error.message;return}
  msg.textContent="Password updated. Redirecting to Admin…";
  setTimeout(()=>location.replace("admin.html"),1200);
 });
});
</script></body></html>
